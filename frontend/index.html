<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcadia · Emergency Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0d0f;
            color: #e8edf2;
            height: 100vh;
            overflow: hidden;
        }
        /* Scrollbar personalizada (oscura y delgada) */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1e24; }
        ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 8px; }

        /* --- MAPA --- */
        #map { height: 100%; width: 100%; }
        .map-container {
            filter: saturate(1.2) contrast(1.1) hue-rotate(0deg);
            background: #0b0d0f;
        }
        /* Estilo para que el mapa combine con el tema oscuro */
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        /* --- GLASSMORPHISM & CARDS --- */
        .glass-panel {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .stat-card {
            background: rgba(15, 19, 24, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }
        .stat-card:hover {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(30, 35, 45, 0.6);
            transform: translateY(-1px);
        }

        /* --- INDICADORES VISUALES --- */
        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .pulse-dot.warning { background: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.5); }
        .pulse-dot.danger { background: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .glow-text {
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
        }

        /* --- BADGES DE ESTADO --- */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .badge-status.active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-status.inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-status.standby { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }

        /* --- TABLA --- */
        .table-row {
            transition: background 0.15s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .table-row:hover {
            background: rgba(239, 68, 68, 0.04);
        }
        .table-row:last-child { border-bottom: none; }

        /* --- ICONOS DE UNIDAD EN EL MAPA --- */
        .unit-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            width: 36px !important;
            height: 36px !important;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 0 60px rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease;
        }
        .unit-marker:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER MODERNO                               -->
    <!-- ========================================== -->
    <header class="glass-panel px-6 py-3 flex flex-col md:flex-row justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-red-500/10 px-3 py-1.5 rounded-full border border-red-500/20">
                <span class="text-red-500 text-lg">●</span>
                <span class="text-xs font-bold text-red-400 tracking-widest">LIVE</span>
            </div>
            <h1 class="text-lg font-bold tracking-tight text-white glow-text flex items-center gap-2">
                🚒 ARCADIA
                <span class="text-xs font-normal text-gray-400 hidden sm:inline-block">·</span>
                <span class="text-xs font-normal text-gray-400 hidden sm:inline-block">DISPATCH</span>
            </h1>
            <span class="hidden lg:inline-block text-[10px] px-2 py-0.5 bg-white/5 text-gray-400 rounded-md border border-white/5 font-mono">
                Aragua · VE
            </span>
        </div>
        <div class="flex items-center gap-4 mt-2 md:mt-0">
            <div class="flex items-center gap-2 text-xs text-gray-400">
                <span class="pulse-dot"></span>
                <span class="hidden sm:inline">Backend</span>
                <span class="font-mono text-green-400 bg-black/30 px-2 py-0.5 rounded border border-green-500/20">Go</span>
            </div>
            <div class="text-xs bg-black/40 px-3 py-1 rounded-lg border border-white/5 text-gray-400 font-mono">
                <span class="text-green-400">●</span> :8081
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- CONTENIDO PRINCIPAL                         -->
    <!-- ========================================== -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-5 gap-4 p-4 h-[calc(100vh-72px)]">

        <!-- Panel Izquierdo: Analytics Premium -->
        <div class="lg:col-span-1 glass-panel rounded-2xl p-5 flex flex-col shadow-2xl">
            
            <!-- Header Panel -->
            <div class="flex items-center justify-between border-b border-white/5 pb-3 mb-4">
                <h2 class="text-xs font-semibold text-gray-300 tracking-widest">📊 ANALYTICS</h2>
                <span class="text-[10px] text-gray-500 bg-black/30 px-2 py-0.5 rounded-full border border-white/5" id="last-update">
                    ⏳ sync
                </span>
            </div>

            <!-- Tarjetas de KPIs -->
            <div class="grid grid-cols-2 gap-2 mb-4">
                <div class="stat-card rounded-xl p-3 text-center">
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Total Ops</p>
                    <p class="text-2xl font-bold text-white" id="stat-total">0</p>
                </div>
                <div class="stat-card rounded-xl p-3 text-center">
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Avg ETA</p>
                    <p class="text-2xl font-bold text-emerald-400" id="stat-avg-eta">0 min</p>
                </div>
            </div>

            <!-- Tabla de Unidades -->
            <div class="flex-1 overflow-y-auto min-h-0">
                <table class="w-full text-left text-xs">
                    <thead class="text-[10px] text-gray-400 uppercase tracking-wider bg-black/20 sticky top-0 rounded-t-lg">
                        <tr>
                            <th class="p-2 font-medium">Unidad</th>
                            <th class="p-2 text-center font-medium">Ops</th>
                            <th class="p-2 text-right font-medium">ETA</th>
                            <th class="p-2 text-center font-medium">Status</th>
                        </tr>
                    </thead>
                    <tbody id="metrics-table" class="divide-y divide-white/5">
                        <tr><td colspan="4" class="p-4 text-center text-gray-500 text-xs">⏳ Inicializando...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pie de panel -->
            <div class="mt-3 pt-3 border-t border-white/5 flex justify-between text-[10px] text-gray-500">
                <span>🔄 <span id="refresh-indicator">5s</span></span>
                <span class="font-mono" id="unit-count">0 unidades</span>
            </div>
        </div>

        <!-- Mapa -->
        <div class="lg:col-span-4 glass-panel rounded-2xl overflow-hidden border border-white/5 relative shadow-2xl map-container">
            <div id="map" class="w-full h-full"></div>
            
            <!-- Overlay de estado en el mapa -->
            <div class="absolute bottom-4 right-4 glass-panel px-3 py-1.5 rounded-lg border border-white/5 text-[10px] text-gray-400 flex items-center gap-2">
                <span class="pulse-dot"></span>
                <span>Sistema activo</span>
                <span class="w-px h-4 bg-white/10 mx-1"></span>
                <span id="online-units" class="text-white font-semibold">0</span>
                <span class="text-gray-500">unidades</span>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- SCRIPTS                                    -->
    <!-- ========================================== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ------------------------------------------
        // CONFIGURACIÓN
        // ------------------------------------------
        const API_URL = 'https://arcadia-backend.onrender.com';
        const REFRESH_INTERVAL = 5000;

        // ------------------------------------------
        // MAPA
        // ------------------------------------------
        const map = L.map('map', { zoomControl: false }).setView([10.2442, -67.5921], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // ------------------------------------------
        // ESTADO GLOBAL
        // ------------------------------------------
        const state = {
            markers: {},
            routes: {}
        };

        // ------------------------------------------
        // ESTILOS
        // ------------------------------------------
        const routeStyles = {
            'UNIT-FIRE-03': { color: '#ef4444', weight: 3, opacity: 0.9 },
            'UNIT-AMBULANCE-01': { color: '#10b981', weight: 3, opacity: 0.9 },
            'UNIT-POLICE-09': { color: '#3b82f6', weight: 3, opacity: 0.9 },
            'default': { color: '#f59e0b', weight: 2, opacity: 0.6, dashArray: '4, 8' }
        };

        const unitIcons = {
            'UNIT-FIRE-03': L.divIcon({ className: 'unit-marker', html: '🔥', iconSize: [36, 36], iconAnchor: [18, 18] }),
            'UNIT-AMBULANCE-01': L.divIcon({ className: 'unit-marker', html: '🚑', iconSize: [36, 36], iconAnchor: [18, 18] }),
            'UNIT-POLICE-09': L.divIcon({ className: 'unit-marker', html: '👮', iconSize: [36, 36], iconAnchor: [18, 18] }),
            'default': L.divIcon({ className: 'unit-marker', html: '📍', iconSize: [30, 30], iconAnchor: [15, 15] })
        };

        // ------------------------------------------
        // UTILIDADES
        // ------------------------------------------
        function parseWKTPoint(wkt) {
            if (!wkt || typeof wkt !== 'string') return null;
            try {
                const coords = wkt.replace('POINT(', '').replace(')', '').split(' ');
                return [parseFloat(coords[1]), parseFloat(coords[0])];
            } catch { return null; }
        }

        function getUnitIcon(id) { return unitIcons[id] || unitIcons['default']; }
        function getRouteStyle(id) { return routeStyles[id] || routeStyles['default']; }

        // ------------------------------------------
        // FETCH DATA
        // ------------------------------------------
        async function fetchAnalytics() {
            try {
                const res = await fetch(`${API_URL}/api/analytics`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    updateUI(data);
                    document.getElementById('last-update').textContent = `🔄 ${new Date().toLocaleTimeString('es')}`;
                } else {
                    showError('Formato de datos inválido');
                }
            } catch (err) {
                console.error('Error:', err);
                showError('No se pudo conectar con el servidor');
            }
        }

        // ------------------------------------------
        // RENDER UI
        // ------------------------------------------
        function updateUI(metrics) {
            const tbody = document.getElementById('metrics-table');
            let totalOps = 0, totalEta = 0;
            let activeCount = 0;

            // Limpiar marcadores viejos del mapa (solo los que ya no existen)
            const currentUnits = new Set(metrics.map(m => m.unidad));
            Object.keys(state.markers).forEach(key => {
                if (!currentUnits.has(key)) {
                    map.removeLayer(state.markers[key]);
                    delete state.markers[key];
                }
            });
            Object.keys(state.routes).forEach(key => {
                if (!currentUnits.has(key)) {
                    map.removeLayer(state.routes[key]);
                    delete state.routes[key];
                }
            });

            if (!metrics || metrics.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500 text-xs">📭 No hay datos de unidades</td></tr>`;
                document.getElementById('stat-total').textContent = '0';
                document.getElementById('stat-avg-eta').textContent = '—';
                document.getElementById('unit-count').textContent = '0 unidades';
                document.getElementById('online-units').textContent = '0';
                return;
            }

            tbody.innerHTML = '';

            metrics.forEach(metric => {
                const unidad = metric.unidad || 'Unknown';
                const ops = metric.total_despachos || 0;
                const eta = metric.eta_promedio_min || 0;
                totalOps += ops;
                totalEta += eta;

                // Determinar estado visual
                let statusClass = 'inactive';
                let statusText = 'Inactiva';
                if (ops > 5) { statusClass = 'active'; statusText = 'Activa'; activeCount++; }
                else if (ops > 0) { statusClass = 'standby'; statusText = 'Standby'; activeCount++; }

                // FILA TABLA
                const row = document.createElement('tr');
                row.className = 'table-row';
                row.innerHTML = `
                    <td class="p-2 font-mono text-[11px] text-gray-200">${unidad}</td>
                    <td class="p-2 text-center font-bold ${ops > 0 ? 'text-white' : 'text-gray-500'}">${ops}</td>
                    <td class="p-2 text-right ${eta > 0 ? 'text-emerald-400' : 'text-gray-500'}">${eta > 0 ? eta.toFixed(1) + ' min' : '—'}</td>
                    <td class="p-2 text-center"><span class="badge-status ${statusClass}">${statusText}</span></td>
                `;
                tbody.appendChild(row);

                // MARCADOR EN MAPA
                const latLng = parseWKTPoint(metric.centroide_operaciones);
                if (latLng && ops > 0) {
                    if (state.markers[unidad]) {
                        state.markers[unidad].setLatLng(latLng);
                    } else {
                        const marker = L.marker(latLng, { icon: getUnitIcon(unidad) }).addTo(map);
                        marker.bindPopup(`
                            <div style="background:#1a1e24; color:white; padding:12px; border-radius:12px; border:1px solid #333; min-width:180px;">
                                <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                                    <span style="font-size:20px;">${unidad.includes('FIRE') ? '🔥' : unidad.includes('AMBULANCE') ? '🚑' : unidad.includes('POLICE') ? '👮' : '📍'}</span>
                                    <strong style="color:#ef4444;">${unidad}</strong>
                                </div>
                                <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa;">
                                    <span>Despachos: <strong style="color:white;">${ops}</strong></span>
                                    <span>ETA: <strong style="color:#10b981;">${eta.toFixed(1)} min</strong></span>
                                </div>
                                <div style="margin-top:6px; font-size:10px; color:#555; border-top:1px solid #2a2e34; padding-top:4px;">
                                    ${statusText} · ${new Date().toLocaleTimeString('es')}
                                </div>
                            </div>
                        `);
                        state.markers[unidad] = marker;
                    }
                }

                // RUTA EN MAPA
                if (metric.ultima_ruta) {
                    try {
                        let routeData = typeof metric.ultima_ruta === 'string' ? JSON.parse(metric.ultima_ruta) : metric.ultima_ruta;
                        if (routeData?.geometry) {
                            if (state.routes[unidad]) map.removeLayer(state.routes[unidad]);
                            state.routes[unidad] = L.geoJSON(routeData, { style: getRouteStyle(unidad) }).addTo(map);
                        }
                    } catch (e) { /* ignorar rutas inválidas */ }
                }
            });

            // Actualizar KPIs
            const avgEta = metrics.length > 0 ? totalEta / metrics.length : 0;
            document.getElementById('stat-total').textContent = totalOps;
            document.getElementById('stat-avg-eta').textContent = avgEta > 0 ? avgEta.toFixed(1) + ' min' : '—';
            document.getElementById('unit-count').textContent = metrics.length + ' unidades';
            document.getElementById('online-units').textContent = activeCount;
        }

        function showError(msg) {
            document.getElementById('metrics-table').innerHTML = `
                <tr><td colspan="4" class="p-4 text-center text-red-400/80 text-xs">
                    ⚠️ ${msg}
                </td></tr>
            `;
            document.getElementById('last-update').textContent = '❌ Error';
        }

        // ------------------------------------------
        // INICIALIZACIÓN
        // ------------------------------------------
        fetchAnalytics();
        setInterval(fetchAnalytics, REFRESH_INTERVAL);

        // Contador de segundos para el indicador
        let seconds = 0;
        setInterval(() => {
            seconds = (seconds + 1) % 6;
            document.getElementById('refresh-indicator').textContent = `${REFRESH_INTERVAL/1000 - seconds}s`;
        }, 1000);

        // Popup de bienvenida en el mapa
        setTimeout(() => {
            L.popup({ className: 'glass-panel' })
                .setLatLng([10.2442, -67.5921])
                .setContent(`
                    <div style="color:white; padding:4px 8px; text-align:center;">
                        <strong style="color:#ef4444; font-size:16px;">🚒 Arcadia</strong><br>
                        <span style="color:#aaa; font-size:11px;">Sistema de Despacho</span>
                    </div>
                `)
                .openOn(map);
            setTimeout(() => map.closePopup(), 5000);
        }, 500);

        console.log('🚒 Arcadia UI v2.0 - Modo Profesional');
        console.log(`📡 API: ${API_URL}`);
    </script>
</body>
</html>
